services:
  migrate:
    build: .
    restart: "no"
    env_file:
      - .env
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - /opt/surfaced/object-data:/opt/surfaced/object-data
      - /opt/surfaced/backups:/opt/surfaced/backups
    logging: *default-logging

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - /opt/surfaced/object-data:/opt/surfaced/object-data
      - /opt/surfaced/backups:/opt/surfaced/backups
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test -d /opt/surfaced/postgres-wal && (test ! -f /opt/surfaced/postgres-wal/%f && cp %p /opt/surfaced/postgres-wal/%f || test -f /opt/surfaced/postgres-wal/%f)"
      - "-c"
      - "archive_timeout=60s"
    volumes:
      - surfaced_cloud_pg:/var/lib/postgresql/data
      - /opt/surfaced/postgres-wal:/opt/surfaced/postgres-wal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  surfaced_cloud_pg:
