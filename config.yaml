# AI平台品牌监控配置文件

# ==================== 调度配置 ====================
scheduler:
  # 基础检查间隔（秒）
  interval: 300

  # 夜间休眠模式
  night_mode: true
  night_start: "23:00"  # 夜间开始时间
  night_end: "07:00"    # 夜间结束时间

  # 随机偏移 ±20%
  random_jitter: 0.2

# ==================== 机器人配置 ====================
# 可以配置多个企业微信机器人，每个任务可以指定使用哪个
wechat_bots:
  default:
    name: "默认群"
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY_HERE"

  # 可以添加更多机器人，比如：
  # sales_group:
  #   name: "销售部"
  #   webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=XXX"
  #
  # tech_group:
  #   name: "技术部"
  #   webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YYY"

# 默认通知设置
default_notification:
  cooldown_minutes: 30   # 同排名冷却时间
  send_interval: 2       # 发送间隔（秒）

# ==================== 平台配置 ====================
platforms:
  doubao:
    enabled: true
    user_data_dir: "./auth/doubao"

  deepseek:
    enabled: false
    user_data_dir: "./auth/deepseek"

  kimi:
    enabled: false
    user_data_dir: "./auth/kimi"

  yuanbao:
    enabled: false
    user_data_dir: "./auth/yuanbao"

  tongyi:
    enabled: false
    user_data_dir: "./auth/tongyi"

  wenxin:
    enabled: false
    user_data_dir: "./auth/wenxin"

# ==================== 监控任务配置 ====================
# 每个任务可以独立配置：
# - 使用哪个机器人 (wechat_bot)
# - 运行时间 (weekdays)
# - 是否启用 (enabled)
#
# weekdays: 0=周一, 1=周二, ..., 6=周日

tasks:
  # 示例1：即搜AI监控 → 发送到默认群
  - name: "豆包-即搜AI"
    platform: doubao
    keyword: "武汉geo优化公司"
    brand: "即搜AI"
    enabled: true
    weekdays: [0, 1, 2, 3, 4]
    wechat_bot: default  # 指定使用哪个机器人

  # 示例2：DeepSeek监控 → 发送到技术群（如果有配置）
  # - name: "DeepSeek-DeepSeek"
  #   platform: deepseek
  #   keyword: "AI写作工具"
  #   brand: "DeepSeek"
  #   enabled: true
  #   weekdays: [0, 1, 2, 3, 4, 5, 6]
  #   wechat_bot: tech_group  # 发送到技术部群

  # 示例3：可以添加更多任务，随时增删改
  # - name: "Kimi-品牌监控"
  #   platform: kimi
  #   keyword: "AI助手"
  #   brand: "Kimi"
  #   enabled: true
  #   weekdays: [1, 3, 5]  # 只在周2/4/6运行
  #   wechat_bot: sales_group

# ==================== 截图配置 ====================
screenshot:
  # 保存格式: jpg / png
  format: "jpg"
  # JPG质量 (1-100)
  quality: 85
  # 最大宽度（像素），超出会缩放
  max_width: 1920
  # 自动清理配置
  auto_cleanup: true
  # 保留天数
  keep_days: 7
  # 最大占用空间 (MB)
  max_size_mb: 500
