scheduler:
  interval: 300
  night_mode: true
  night_start: '23:00'
  night_end: 07:00
  random_jitter: 0.2
wechat_bots:
  default:
    name: 默认群
    webhook_url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY_HERE
default_notification:
  cooldown_minutes: 30
  send_interval: 2
platforms:
  doubao:
    enabled: true
    user_data_dir: ./auth/doubao
  deepseek:
    enabled: false
    user_data_dir: ./auth/deepseek
  kimi:
    enabled: false
    user_data_dir: ./auth/kimi
  yuanbao:
    enabled: false
    user_data_dir: ./auth/yuanbao
  tongyi:
    enabled: false
    user_data_dir: ./auth/tongyi
  wenxin:
    enabled: false
    user_data_dir: ./auth/wenxin
tasks:
- name: 豆包-即搜AI
  platform: doubao
  keyword: 武汉geo优化公司
  brand: 即搜AI
  enabled: true
  weekdays:
  - 0
  - 1
  - 2
  - 3
  - 4
  wechat_bot: default
- name: '1'
  platform: doubao
  keyword: 武汉GEO优化公司
  brand: 即搜AI
  webhook_url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=1dec6872-9bb7-4058-9dc2-44f86953ace3
  weekdays:
  - 0
  - 1
  - 2
  - 3
  - 4
  enabled: true
  schedule:
  - '15:00'
screenshot:
  format: jpg
  quality: 85
  max_width: 1920
  auto_cleanup: true
  keep_days: 7
  max_size_mb: 500
